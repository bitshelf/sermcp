name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # tracing-perfetto-sdk-schema compiles perfetto_trace.proto via
      # prost-build at build time, which requires a protoc binary.
      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
      # Every step below runs from the workspace root (the repo's manifest
      # root); `-p sermcp` keeps the gate scope exactly what it was when these
      # steps ran with `working-directory: sermcp`.
      # ── Lint gates (fail the PR before tests run) ─────────────────
      - name: Format gate
        run: cargo fmt --all --check
      - name: Clippy gate (deny all warnings)
        run: cargo clippy --locked -p sermcp --all-targets -- -D warnings
      # ── Tests ─────────────────────────────────────────────────────
      - name: Test
        run: cargo test --locked -p sermcp --lib -- --test-threads=1
      - name: Smoke tests
        run: cargo test --locked -p sermcp --test smoke -- --test-threads=1
      # ── Static (musl) build gate ─────────────────────────────────
      - name: Static musl build
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo musl
      # The install one-liner from README.md/DEPLOY.md, run against this very
      # checkout: it is the only step that reads the repository root manifest,
      # so it is what catches a [patch]/[profile] that a workspace member
      # cannot provide.
      - name: Verify static Git installation
        run: |
          cargo install --git "file://$GITHUB_WORKSPACE" --locked \
            --target x86_64-unknown-linux-musl \
            --target-dir "$GITHUB_WORKSPACE/target" \
            --root "$RUNNER_TEMP/sermcp-install" --force
          for bin in sermcp dutabo; do
            executable="$RUNNER_TEMP/sermcp-install/bin/$bin"
            readelf -l "$executable" > "$RUNNER_TEMP/$bin.headers"
            readelf -d "$executable" > "$RUNNER_TEMP/$bin.dynamic"
            if grep -q INTERP "$RUNNER_TEMP/$bin.headers" || \
               grep -q NEEDED "$RUNNER_TEMP/$bin.dynamic"; then
              echo "Dynamic dependency found in $bin" >&2
              exit 1
            fi
            "$executable" --help > /dev/null
          done
      - name: Build
        run: cargo build --release --locked
